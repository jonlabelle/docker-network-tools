name: test prune script

on:
  push:
    paths:
      - 'scripts/prune/**'
      - .github/workflows/test-prune-script.yml
    branches: [main]
  pull_request:
    paths:
      - 'scripts/prune/**'
      - .github/workflows/test-prune-script.yml
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: scripts/prune

    steps:
      - name: Check out repository
        uses: actions/checkout@main

      - name: Set up Python
        uses: actions/setup-python@main
        with:
          python-version: '3.x'
          check-latest: true
          cache: 'pip'
          cache-dependency-path: 'scripts/prune/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: |
          echo "Running unit tests"
          python tests/test_prune.py

      - name: Run integration tests
        run: |
          echo "Running integration tests"
          python tests/test_integration.py

      - name: Run all tests via test runner
        run: |
          echo "Running comprehensive test suite"
          echo "Using Python: $(which python)"
          python test_runner.py

      - name: Check script can show help
        run: |
          echo "Testing CLI help interface"
          python main.py --help
